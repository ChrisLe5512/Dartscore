<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Darts Scoreboard</title>
	<meta name="description" content="Fast darts scoreboard for 301, 501 and 701 with checkout suggestions.">
	<meta name="theme-color" content="#000000">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Dartscore">
	<link rel="icon" href="images/icons/icon-192.png">
	<link rel="apple-touch-icon" href="images/icons/icon-192.png">
	<link rel="manifest" href="manifest.json">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
	<link rel="stylesheet" href="css/styles.css">
	<script type="module" src="js/app.js"></script>
</head>

<body>
	<main>
		<aside>
			<section class="scores-section">
				<table class="scores-tbl">
					<tbody>
						<tr class="add-player" role="button" aria-label="Add player"><td colspan="7">+</td></tr>
					</tbody>
				</table>
			</section>

			<section class="calc-section">
				<table class="calc-tbl">
					<tbody>
						<tr>
							<td data-digit="7">7</td>
							<td data-digit="8">8</td>
							<td data-digit="9">9</td>
							<td class="back-score disabled" aria-label="Delete digit">&#10229;<br>&#10229;<br>&#10229;<br>&#10229;</td>
						</tr>
						<tr>
							<td data-digit="4">4</td>
							<td data-digit="5">5</td>
							<td data-digit="6">6</td>
							<td rowspan="2" class="calc-score disabled" aria-label="Score: tap top to add 1, bottom to subtract 1"></td>
						</tr>
						<tr>
							<td data-digit="1">1</td>
							<td data-digit="2">2</td>
							<td data-digit="3">3</td>
						</tr>
						<tr>
							<td colspan="2" data-digit="0">0</td>
							<td class="reset-score disabled" aria-label="Clear score">&#8634;</td>
							<td class="check-score disabled" aria-label="Submit score">&#10003;</td>
						</tr>
					</tbody>
				</table>
			</section>
		</aside>

		<section class="ctrl-section">
			<table class="ctrl-tbl">
				<tbody>
					<tr>
						<td class="undo disabled" aria-label="Undo">&#8630;</td>
						<td class="redo disabled" aria-label="Redo">&#8631;</td>
					</tr>
					<tr><td class="hidden"></td></tr>
					<tr><td class="keypad-btn" role="button" aria-label="Hide keypad" aria-expanded="true"><b class="keypad-icon">&#x25A6;</b><span>&#x25BE;</span></td></tr>
					<tr>
						<td class="settings-btn" aria-label="Settings">&#9881;</td>
						<td class="full-screen" aria-label="Full screen">&#9974;</td>
					</tr>
				</tbody>
			</table>
		</section>

		<section class="dartboard-section">
			<svg id="dartboard" class="dartboard" role="img" aria-label="Dartboard"></svg>
		</section>

		<section class="btn-section">
			<table class="btn-tbl">
				<tbody>
					<tr><td rowspan="2" colspan="2" class="large-btn bust-btn">BUST</td></tr>
					<tr><td class="hidden"></td></tr>
					<tr><td class="hidden"></td></tr>
					<tr>
						<td class="hidden"></td>
						<td class="darts-clear disabled">Darts</td>
					</tr>
					<tr>
						<td class="hidden"></td>
						<td rowspan="5" class="darts-btn"></td>
					</tr>
					<tr></tr>
					<tr></tr>
					<tr></tr>
					<tr></tr>
					<tr>
						<td class="hidden"></td>
						<td class="darts-total disabled"></td>
					</tr>
					<tr><td class="hidden"></td></tr>
					<tr><td rowspan="2" colspan="2" class="large-btn done-btn disabled">DONE</td></tr>
					<tr><td class="hidden"></td></tr>
				</tbody>
			</table>
			<div class="darts">
				<span></span>
				<span></span>
				<span></span>
			</div>
		</section>

		<span class="debug-span" hidden></span>

		<div class="player-menu" role="menu" aria-label="Player" hidden>
			<div class="player-menu-name"></div>
			<button type="button" role="menuitem" data-menu="rename"><span>&#x270E;</span>Rename</button>
			<button type="button" role="menuitem" data-menu="throw"><span>&#x25B6;</span>Throw now</button>
			<button type="button" role="menuitem" data-menu="up"><span>&#x25B2;</span>Move up</button>
			<button type="button" role="menuitem" data-menu="down"><span>&#x25BC;</span>Move down</button>
			<button type="button" role="menuitem" data-menu="remove" class="danger"><span>&#10006;</span>Remove</button>
		</div>

		<div class="toast" role="status" aria-live="polite" hidden><b class="toast-title"></b> <span class="toast-detail"></span></div>

		<div class="settings-background" id="settings" role="dialog" aria-modal="true" aria-label="Settings" hidden>
			<section class="settings-section settings-main">
				<h2 class="settings-heading">Game settings</h2>
				<table class="settings-tbl">
					<tbody>
						<tr>
							<td>
								<label for="start-score">Start score</label>
								<select id="start-score"></select>
							</td>
							<td>
								<label class="settings-check"><input type="checkbox" id="double-out"> Double out</label>
							</td>
						</tr>
						<tr>
							<td>
								<label for="num-legs">Legs per set</label>
								<input type="number" id="num-legs" inputmode="numeric" min="1">
							</td>
							<td>
								<label for="num-sets">Sets to win</label>
								<input type="number" id="num-sets" inputmode="numeric" min="1">
							</td>
						</tr>
					</tbody>
				</table>

				<h2 class="settings-heading">Players</h2>
				<div class="players-scroll">
					<ol class="players-list"></ol>
					<button type="button" class="players-add" aria-label="Add player">+</button>
				</div>

				<table class="settings-tbl">
					<tbody>
						<tr>
							<td colspan="2"><button type="button" class="settings-btn-action settings-link" data-action="visuals">Board &amp; visuals &#8250;</button></td>
						</tr>
						<tr class="settings-note-row" hidden>
							<td colspan="2" class="settings-note">These changes start a new game.</td>
						</tr>
						<tr>
							<td><button type="button" class="settings-btn-action" data-action="new-game">New game</button></td>
							<td><button type="button" class="settings-btn-action" data-action="close">Done</button></td>
						</tr>
					</tbody>
				</table>
			</section>

			<section class="settings-section visuals-section" aria-label="Board and visuals" hidden>
				<div class="visuals">
					<svg class="dartboard board-preview" aria-hidden="true"></svg>
					<div class="visuals-controls">
						<label class="range">Bullseye <output></output><input type="range" data-layout="bull" step="0.5"></label>
						<label class="range">Outer bull <output></output><input type="range" data-layout="outerBull" step="0.5"></label>
						<label class="range">Treble ring position <output></output><input type="range" data-layout="trebleAt" step="0.5"></label>
						<label class="range">Treble ring width <output></output><input type="range" data-layout="treble" step="0.5"></label>
						<label class="range">Double ring width <output></output><input type="range" data-layout="double" step="0.5"></label>
						<label class="range">Number ring width <output></output><input type="range" data-layout="legend" step="0.5"></label>
						<label class="range">Outline <output></output><input type="range" data-style="outline" step="0.1"></label>
						<div class="swatches" role="group" aria-label="Outline colour"></div>
						<label class="settings-check"><input type="checkbox" data-style="wires"> Wires around every bed</label>
					</div>
				</div>
				<table class="settings-tbl">
					<tbody>
						<tr>
							<td><button type="button" class="settings-btn-action" data-action="visuals-reset">Reset</button></td>
							<td><button type="button" class="settings-btn-action" data-action="visuals-back">Done</button></td>
						</tr>
					</tbody>
				</table>
			</section>
		</div>

		<div class="settings-background" id="winner" role="dialog" aria-modal="true" aria-label="Match won" hidden>
			<section class="settings-section winner-section">
				<p class="winner-text"><span class="winner-icon">&#127942;</span><br><span class="winner-name"></span> wins!</p>
				<table class="settings-tbl">
					<tbody>
						<tr>
							<td><button type="button" class="settings-btn-action" data-action="rematch">Rematch</button></td>
							<td><button type="button" class="settings-btn-action" data-action="close">Close</button></td>
						</tr>
					</tbody>
				</table>
			</section>
		</div>
	</main>
</body>

</html>
