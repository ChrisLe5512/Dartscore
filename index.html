<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Darts Scoreboard</title>
	<meta name="description" content="Fast darts scoreboard for 301, 501 and 701 with checkout suggestions.">
	<meta name="theme-color" content="#000000">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Dartscore">
	<link rel="icon" href="images/icons/icon-192.png">
	<link rel="apple-touch-icon" href="images/icons/icon-192.png">
	<link rel="manifest" href="manifest.json">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap">
	<link rel="stylesheet" href="css/styles.css">
	<link rel="preload" as="image" href="images/dartboards/dartboard_base.webp">
	<script type="module" src="js/app.js"></script>
</head>

<body>
	<main>
		<aside>
			<section class="scores-section">
				<table class="scores-tbl">
					<tbody>
						<tr class="add-player" role="button" aria-label="Add player"><td colspan="7">+</td></tr>
					</tbody>
				</table>
			</section>

			<section class="calc-section">
				<table class="calc-tbl">
					<tbody>
						<tr>
							<td data-digit="7">7</td>
							<td data-digit="8">8</td>
							<td data-digit="9">9</td>
							<td class="back-score disabled" aria-label="Delete digit">&#10229;<br>&#10229;<br>&#10229;<br>&#10229;</td>
						</tr>
						<tr>
							<td data-digit="4">4</td>
							<td data-digit="5">5</td>
							<td data-digit="6">6</td>
							<td rowspan="2" class="calc-score disabled" aria-label="Score: tap top to add 1, bottom to subtract 1"></td>
						</tr>
						<tr>
							<td data-digit="1">1</td>
							<td data-digit="2">2</td>
							<td data-digit="3">3</td>
						</tr>
						<tr>
							<td colspan="2" data-digit="0">0</td>
							<td class="reset-score disabled" aria-label="Clear score">&#8634;</td>
							<td class="check-score disabled" aria-label="Submit score">&#10003;</td>
						</tr>
					</tbody>
				</table>
			</section>
		</aside>

		<section class="ctrl-section">
			<table class="ctrl-tbl">
				<tbody>
					<tr>
						<td class="undo disabled" aria-label="Undo">&#8630;</td>
						<td class="redo disabled" aria-label="Redo">&#8631;</td>
					</tr>
					<tr><td class="hidden"></td></tr>
					<tr><td class="keypad-btn" role="button" aria-label="Hide keypad" aria-expanded="true"><span>&#x25BE;</span></td></tr>
					<tr>
						<td class="settings-btn" aria-label="Settings">&#9881;</td>
						<td class="full-screen" aria-label="Full screen">&#9974;</td>
					</tr>
				</tbody>
			</table>
		</section>

		<section class="dartboard-section">
			<img id="dartboard" class="dartboard-img" src="images/dartboards/dartboard_base.webp" alt="Dartboard" draggable="false">
			<div class="board-marks" aria-hidden="true"></div>
		</section>

		<section class="btn-section">
			<table class="btn-tbl">
				<tbody>
					<tr><td rowspan="2" colspan="2" class="large-btn bust-btn">BUST</td></tr>
					<tr><td class="hidden"></td></tr>
					<tr><td class="hidden"></td></tr>
					<tr>
						<td class="hidden"></td>
						<td class="darts-clear disabled">Darts</td>
					</tr>
					<tr>
						<td class="hidden"></td>
						<td rowspan="5" class="darts-btn"></td>
					</tr>
					<tr></tr>
					<tr></tr>
					<tr></tr>
					<tr></tr>
					<tr>
						<td class="hidden"></td>
						<td class="darts-total disabled"></td>
					</tr>
					<tr><td class="hidden"></td></tr>
					<tr><td rowspan="2" colspan="2" class="large-btn done-btn disabled">DONE</td></tr>
					<tr><td class="hidden"></td></tr>
				</tbody>
			</table>
			<div class="darts">
				<span></span>
				<span></span>
				<span></span>
			</div>
		</section>

		<span class="debug-span" hidden></span>

		<div class="toast" role="status" aria-live="polite" hidden><b class="toast-title"></b> <span class="toast-detail"></span></div>

		<div class="settings-background" id="settings" role="dialog" aria-modal="true" aria-label="Settings" hidden>
			<section class="settings-section">
				<table class="settings-tbl">
					<tbody>
						<tr>
							<td>
								<label for="start-score">Start score</label>
								<select id="start-score"></select>
							</td>
							<td>
								<label class="settings-check"><input type="checkbox" id="double-out"> Double out</label>
							</td>
						</tr>
						<tr>
							<td>
								<label for="num-legs">Legs per set</label>
								<input type="number" id="num-legs" inputmode="numeric" min="1">
							</td>
							<td>
								<label for="num-sets">Sets to win</label>
								<input type="number" id="num-sets" inputmode="numeric" min="1">
							</td>
						</tr>
						<tr>
							<td colspan="2">
								<table class="players-tbl">
									<tbody>
										<tr class="players-add" role="button" aria-label="Add player"><td colspan="4">+</td></tr>
									</tbody>
								</table>
							</td>
						</tr>
						<tr class="settings-note-row" hidden>
							<td colspan="2" class="settings-note">These changes start a new game.</td>
						</tr>
						<tr>
							<td><button type="button" class="settings-btn-action" data-action="new-game">New game</button></td>
							<td><button type="button" class="settings-btn-action" data-action="close">Done</button></td>
						</tr>
					</tbody>
				</table>
			</section>
		</div>

		<div class="settings-background" id="winner" role="dialog" aria-modal="true" aria-label="Match won" hidden>
			<section class="settings-section winner-section">
				<p class="winner-text"><span class="winner-icon">&#127942;</span><br><span class="winner-name"></span> wins!</p>
				<table class="settings-tbl">
					<tbody>
						<tr>
							<td><button type="button" class="settings-btn-action" data-action="rematch">Rematch</button></td>
							<td><button type="button" class="settings-btn-action" data-action="close">Close</button></td>
						</tr>
					</tbody>
				</table>
			</section>
		</div>
	</main>
</body>

</html>
