<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Dartscore</title>
	<meta name="description" content="Fast darts scoreboard for 301, 501 and 701 with checkout suggestions and practice games.">
	<meta name="theme-color" content="#000000">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Dartscore">
	<link rel="icon" href="images/icons/icon-192.png">
	<link rel="apple-touch-icon" href="images/icons/icon-192.png">
	<link rel="manifest" href="manifest.json">
	<link rel="preload" href="fonts/RobotoFlex-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="fonts/RobotoCondensed-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/styles.css">
	<script src="js/version.js"></script>
	<script type="module" src="js/app.js"></script>
</head>

<body>
	<main>
		<aside>
			<section class="scores-section">
				<table class="scores-tbl">
					<tbody></tbody>
				</table>
			</section>

			<section class="calc-section">
				<table class="calc-tbl">
					<tbody>
						<tr>
							<td data-digit="7" role="button">7</td>
							<td data-digit="8" role="button">8</td>
							<td data-digit="9" role="button">9</td>
							<td class="back-score disabled" role="button" aria-label="Delete digit">&#x232B;</td>
						</tr>
						<tr>
							<td data-digit="4" role="button">4</td>
							<td data-digit="5" role="button">5</td>
							<td data-digit="6" role="button">6</td>
							<td rowspan="2" class="calc-score disabled" role="button" aria-label="Score: tap top to add 1, bottom to subtract 1"></td>
						</tr>
						<tr>
							<td data-digit="1" role="button">1</td>
							<td data-digit="2" role="button">2</td>
							<td data-digit="3" role="button">3</td>
						</tr>
						<tr>
							<td colspan="2" data-digit="0" role="button">0</td>
							<td class="reset-score disabled" role="button" aria-label="Clear score">&#8634;</td>
							<td class="check-score disabled" role="button" aria-label="Submit score">&#10003;</td>
						</tr>
					</tbody>
				</table>
			</section>

			<section class="visuals-panel" aria-label="Board layout" tabindex="-1" hidden>
				<h2 class="settings-heading">Board layout</h2>
				<div class="visuals-controls">
					<label class="range"><span class="range-name">Ring width <button type="button" class="info-btn" aria-label="About ring width" data-info="The trebles, the doubles and the bulls, all together. The trebles stay centred.">i</button></span><output></output><input type="range" data-layout="ring" step="0.5"></label>
					<label class="range"><span class="range-name">Number ring <button type="button" class="info-btn" aria-label="About the number ring" data-info="The outer black ring with the numbers. A dart there scores 0.">i</button></span><output></output><input type="range" data-layout="legend" step="0.5"></label>
					<label class="range"><span class="range-name">Wires <button type="button" class="info-btn" aria-label="About wires" data-info="A thin wire round every bed, like the metal spider on a real board: how thick (0 for none). The rings round the doubles and the board&#39;s edge take the same colour.">i</button></span><output></output><input type="range" data-style="wire" step="0.1"></label>
					<div class="swatches outline-swatches" role="group" aria-label="Outline and wires colour"></div>
					<div class="swatch-group">
						<span class="range-name">Highlight <button type="button" class="info-btn" aria-label="About the highlight" data-info="The colour of the beds lit where darts landed, and of a past visit on show.">i</button></span>
						<div class="swatches hit-swatches" role="group" aria-label="Highlight colour"></div>
					</div>
				</div>
				<div class="visuals-actions">
					<button type="button" class="settings-btn-action" data-action="visuals-reset">Reset</button>
					<button type="button" class="settings-btn-action" data-action="visuals-done">Done</button>
				</div>
			</section>
		</aside>

		<!-- The controls beside the board: undo and redo at the top; the keypad
		     and full screen at the bottom. -->
		<section class="ctrl-section">
			<div class="ctrl-row ctrl-top">
				<button type="button" tabindex="-1" class="board-btn ctrl-btn undo disabled" aria-label="Undo" title="Undo (Ctrl+Z)"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
				<button type="button" tabindex="-1" class="board-btn ctrl-btn redo disabled" aria-label="Redo" title="Redo (Ctrl+Y)"><svg class="icon flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
			</div>
			<div class="ctrl-row ctrl-bottom">
				<button type="button" tabindex="-1" class="board-btn ctrl-btn keypad-btn" aria-label="Hide keypad" aria-expanded="true" title="Hide or show the keypad"><svg class="icon keypad-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="5" height="5" rx="1"/><rect x="9.5" y="3.5" width="5" height="5" rx="1"/><rect x="15.5" y="3.5" width="5" height="5" rx="1"/><rect x="3.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="15.5" y="9.5" width="5" height="5" rx="1"/><rect x="3.5" y="15.5" width="5" height="5" rx="1"/><rect x="9.5" y="15.5" width="5" height="5" rx="1"/><rect x="15.5" y="15.5" width="5" height="5" rx="1"/></svg><svg class="icon keypad-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
				<button type="button" tabindex="-1" class="board-btn ctrl-btn full-screen" aria-label="Full screen" title="Full screen (F11)"><svg class="icon fs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6"/><path d="M15 3h6v6"/><path d="M21 15v6h-6"/><path d="M9 21H3v-6"/></svg></button>
			</div>
		</section>

		<section class="dartboard-section">
			<div class="board-frame"><svg id="dartboard" class="dartboard" role="img" aria-label="Dartboard"></svg></div>
		</section>

		<!-- Beside the board on the right: Settings, the turn's darts, Done (✓), and above it No score while no dart is down. -->
		<section class="btn-section">
			<button type="button" tabindex="-1" class="board-btn ctrl-btn settings-btn" aria-label="Settings" title="Settings: players, board layout, new game"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.08 4.85L10.17 2.58L13.83 2.58L13.92 4.85L15.70 5.59L17.37 4.04L19.96 6.63L18.41 8.30L19.15 10.08L21.42 10.17L21.42 13.83L19.15 13.92L18.41 15.70L19.96 17.37L17.37 19.96L15.70 18.41L13.92 19.15L13.83 21.42L10.17 21.42L10.08 19.15L8.30 18.41L6.63 19.96L4.04 17.37L5.59 15.70L4.85 13.92L2.58 13.83L2.58 10.17L4.85 10.08L5.59 8.30L4.04 6.63L6.63 4.04L8.30 5.59Z"/><circle cx="12" cy="12" r="3"/></svg></button>
			<div class="darts">
				<!-- Before the first dart: the three darts of the player throwing (one dart for everyone, for now). -->
				<div class="darts-reveal darts-idle">
					<div><svg class="idle-dart" viewBox="-6 0 52 150" aria-hidden="true">
						<defs>
							<linearGradient id="idle-steel"><stop offset="0" stop-color="#2a2d32"/><stop offset="0.4" stop-color="#6d737b"/><stop offset="0.68" stop-color="#d0d5da"/><stop offset="1" stop-color="#3a3e44"/></linearGradient>
							<linearGradient id="idle-black"><stop offset="0" stop-color="#050505"/><stop offset="0.65" stop-color="#55575c"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient>
							<linearGradient id="idle-vane-left" x1="1" x2="0" y1="0" y2="0"><stop offset="0" style="stop-color: color-mix(in srgb, var(--dart-flight) 55%, black)"/><stop offset="0.5" style="stop-color: var(--dart-flight)"/><stop offset="1" style="stop-color: color-mix(in srgb, var(--dart-flight) 70%, white)"/></linearGradient>
							<linearGradient id="idle-vane-right" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color: color-mix(in srgb, var(--dart-flight) 55%, black)"/><stop offset="0.5" style="stop-color: var(--dart-flight)"/><stop offset="1" style="stop-color: color-mix(in srgb, var(--dart-flight) 70%, white)"/></linearGradient>
							<g id="dart-picture">
								<path d="M20 2L5 12V34L20 54Z" fill="url(#idle-vane-left)"/>
								<path d="M20 2L35 12V34L20 54Z" fill="url(#idle-vane-right)"/>
								<rect x="18.3" y="48" width="3.4" height="32" rx="1" fill="url(#idle-black)"/>
								<path d="M16.6 80H23.4L24.4 86V112L21.6 120H18.4L15.6 112V86Z" fill="url(#idle-steel)"/>
								<path d="M15.8 90H24.2M15.8 94H24.2M15.8 98H24.2M15.8 102H24.2M15.8 106H24.2" stroke="#101214" stroke-width="1.1" opacity="0.55"/>
								<path d="M18.9 120H21.1L20.3 147Q20 149 19.7 147Z" fill="url(#idle-steel)"/>
							</g>
						</defs>
						<use href="#dart-picture" class="dart-behind" transform="rotate(-4 20 148)"/>
						<use href="#dart-picture" class="dart-behind" transform="rotate(4 20 148)"/>
						<use href="#dart-picture"/>
					</svg></div>
				</div>
				<div class="darts-reveal darts-turn">
					<div>
						<button type="button" tabindex="-1" class="darts-clear" title="Clear the darts and start the turn again" disabled>Clear<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
						<span class="empty"></span>
						<span class="empty"></span>
						<span class="empty"></span>
						<div class="darts-left" aria-hidden="true">
							<svg class="left-dart" viewBox="0 0 40 150"><use href="#dart-picture"/></svg>
							<svg class="left-dart" viewBox="0 0 40 150"><use href="#dart-picture"/></svg>
						</div>
					</div>
				</div>
				<div class="darts-hint"><div>Tap again<br>to remove</div></div>
			</div>
			<button type="button" tabindex="-1" class="board-btn side-btn bust-btn" title="This visit counts as 0">No score</button>
			<button type="button" tabindex="-1" class="board-btn side-btn done-btn disabled" aria-label="Score the darts" title="Score the darts tapped on the board"><span class="done-score"><span class="done-total"></span><span class="done-note"><span></span></span></span><span class="done-check">&#10003;</span></button>
		</section>

		<span class="debug-span" hidden></span>

		<div class="player-menu" role="menu" aria-label="Player" hidden>
			<div class="player-menu-head">
				<span class="player-menu-name"></span>
				<input class="player-menu-input" type="text" autocomplete="off" spellcheck="false" aria-label="Player name" hidden>
				<button type="button" role="menuitem" data-menu="rename" class="player-menu-rename" aria-label="Rename"><span class="flip">&#x270E;</span></button>
			</div>
			<button type="button" role="menuitem" data-menu="throw"><span>&#x25B6;</span>Throw now</button>
			<button type="button" role="menuitem" data-menu="up"><span>&#x25B2;</span>Move up</button>
			<button type="button" role="menuitem" data-menu="down"><span>&#x25BC;</span>Move down</button>
			<button type="button" role="menuitem" data-menu="stats"><span>&#x25A4;</span>Match stats</button>
			<button type="button" role="menuitem" data-menu="remove" class="danger"><span>&#10006;</span>Remove</button>
		</div>

		<div class="toast" role="status" aria-live="polite" hidden><span class="toast-text"><b class="toast-title"></b> <span class="toast-detail"></span></span><button type="button" tabindex="-1" class="toast-close" aria-label="Close"><span class="toast-close-word">Close</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

		<div class="settings-background" id="settings" role="dialog" aria-modal="true" aria-label="Settings" tabindex="-1" hidden>
			<section class="settings-section settings-main">
				<h2 class="settings-heading">Current game<span class="settings-version"></span></h2>
				<div class="current-game">
					<p class="settings-summary"></p>
					<button type="button" class="settings-btn-action settings-link" data-action="new-game">New game &#8250;</button>
				</div>

				<h2 class="settings-heading">Settings</h2>
				<table class="settings-tbl">
					<tbody>
						<tr>
							<td><button type="button" class="settings-btn-action settings-link" data-action="visuals">Board layout &#8250;</button></td>
						</tr>
					</tbody>
				</table>

				<h2 class="settings-heading">Players</h2>
				<div class="players-scroll">
					<ol class="players-list"></ol>
					<button type="button" class="players-add" aria-label="Add player">+</button>
				</div>

				<table class="settings-tbl">
					<tbody>
						<tr>
							<td><button type="button" class="settings-btn-action" data-action="close">Done</button></td>
						</tr>
					</tbody>
				</table>
			</section>

		</div>

		<!-- A new game in two steps: what to play, then who plays. -->
		<div class="settings-background" id="new-game" role="dialog" aria-modal="true" aria-labelledby="new-game-title" tabindex="-1" hidden>
			<section class="settings-section new-game-section">
				<div class="ng-step" data-step="game">
					<h2 class="settings-heading" id="new-game-title">New game</h2>
					<div class="game-choices"></div>
					<div class="match-row">
						<div class="option-choice">
							<span class="stepper-label">Match <button type="button" class="info-btn" aria-label="About the match" data-info="Endless: no winner and no sets; play leg after leg for as long as you like, and each card counts the legs won. First to: the first to win the legs takes a set, and the first to win the sets takes the match (with one set, the legs decide it).">i</button></span>
							<div class="segmented match-format" role="radiogroup" aria-label="Match">
								<button type="button" role="radio" data-format="endless">Endless</button>
								<button type="button" role="radio" data-format="first">First to</button>
							</div>
						</div>
						<div class="counts-reveal">
							<div class="counts">
								<div class="stepper" data-field="legs">
									<span class="stepper-label">Legs</span>
									<div class="stepper-row"><button type="button" class="stepper-btn" data-by="-1" aria-label="Fewer legs">&minus;</button><output></output><button type="button" class="stepper-btn" data-by="1" aria-label="More legs">+</button></div>
								</div>
								<div class="stepper" data-field="sets">
									<span class="stepper-label">Sets</span>
									<div class="stepper-row"><button type="button" class="stepper-btn" data-by="-1" aria-label="Fewer sets">&minus;</button><output></output><button type="button" class="stepper-btn" data-by="1" aria-label="More sets">+</button></div>
								</div>
							</div>
						</div>
					</div>
					<div class="game-options-group">
						<span class="stepper-label">Options</span>
						<div class="game-checks">
							<span class="check-line"><label class="settings-check"><input type="checkbox" id="double-out"> Double out</label><button type="button" class="info-btn" aria-label="About Double out" data-info="The last dart must be a double or the bullseye. Leaving 1, or going below 0, is a bust.">i</button></span>
						</div>
					</div>
				</div>

				<div class="ng-step" data-step="players" hidden>
					<h2 class="settings-heading">Who's playing?</h2>
					<div class="segmented who" role="radiogroup" aria-label="Players">
						<button type="button" role="radio" data-who="solo">Solo</button>
						<button type="button" role="radio" data-who="group">Two or more</button>
					</div>
					<div class="who-solo">
						<input type="text" class="solo-name" autocomplete="off" spellcheck="false" placeholder="Your name" aria-label="Your name">
					</div>
					<div class="who-group">
						<ol class="draft-list"></ol>
						<button type="button" class="players-add draft-add" aria-label="Add player">+</button>
					</div>
				</div>

				<div class="dialog-actions">
					<button type="button" class="settings-btn-action" data-action="back">Cancel</button>
					<button type="button" class="settings-btn-action primary" data-action="next">Players &#8250;</button>
				</div>
			</section>
		</div>

		<div class="settings-background" id="winner" role="dialog" aria-modal="true" aria-label="Match won" tabindex="-1" hidden>
			<section class="settings-section winner-section">
				<p class="winner-text"><span class="winner-icon">&#127942;</span><br><span class="winner-name"></span> wins!</p>
				<div class="stats-scroll"><table class="stats-tbl"></table></div>
				<table class="settings-tbl">
					<tbody>
						<tr>
							<td><button type="button" class="settings-btn-action" data-action="rematch">Rematch</button></td>
							<td><button type="button" class="settings-btn-action" data-action="new-game">New game &#8250;</button></td>
							<td><button type="button" class="settings-btn-action" data-action="close">Close</button></td>
						</tr>
					</tbody>
				</table>
			</section>
		</div>

		<div class="settings-background" id="stats" role="dialog" aria-modal="true" aria-labelledby="stats-title" tabindex="-1" hidden>
			<section class="settings-section stats-section">
				<p class="confirm-title" id="stats-title">Match stats</p>
				<div class="stats-scroll"><table class="stats-tbl"></table></div>
				<table class="settings-tbl">
					<tbody>
						<tr>
							<td><button type="button" class="settings-btn-action" data-action="close">Close</button></td>
						</tr>
					</tbody>
				</table>
			</section>
		</div>

		<div class="settings-background" id="confirm-undo" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-detail" tabindex="-1" hidden>
			<section class="settings-section confirm-section">
				<p class="confirm-title" id="confirm-title"></p>
				<p class="confirm-detail" id="confirm-detail"></p>
				<table class="settings-tbl">
					<tbody>
						<tr>
							<td><button type="button" class="settings-btn-action" data-action="close">Cancel</button></td>
							<td><button type="button" class="settings-btn-action" data-action="undo">Undo</button></td>
						</tr>
					</tbody>
				</table>
			</section>
		</div>
	</main>
</body>

</html>
